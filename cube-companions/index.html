<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore an endless block grove, touch creatures to battle, and beat a five-creature boss.">
  <title>Cube Companions</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css?v=story2">
</head>
<body>
  <canvas id="world" aria-label="Endless 3D block grove. Use WASD or arrow keys to move straight. Touch creatures to battle automatically."></canvas>
  <header class="topbar"><a href="../index.html" class="back">← Games</a><div class="brand">CUBE <b>COMPANIONS</b><small>18 TYPES · MEGA</small></div><button id="story">★ Story</button><button id="map">Map</button><button id="journal">Journal</button><button id="types">◎ Types</button><button id="help">? Controls</button></header>
  <aside class="quest"><span class="eyebrow" id="region-name">HOME GROVE</span><h2 id="objective">Choose your first companion</h2><p id="quest-detail">A little island. A big first step.</p><button id="route-compass" class="route-compass" hidden></button><div id="progress"></div><small id="save-status"></small></aside>
  <section id="party" class="party" aria-label="Your companions"></section>
  <div id="interaction-cue" class="interaction-cue" hidden>
    <div class="cue-copy" role="status" aria-live="polite" aria-atomic="true"><span class="cue-key"></span><div><small class="cue-name"></small><strong class="cue-title"></strong><span class="cue-detail"></span></div></div>
    <button id="cue-action" type="button" hidden>Rest & refill</button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <footer class="explore-controls"><span id="hint">WASD / arrows · Touch creatures to battle</span><button id="interact" disabled>Explore the grove</button></footer>
  <div class="dpad" aria-label="Movement controls"><button data-key="ArrowUp" aria-label="Move up">↑</button><button data-key="ArrowLeft" aria-label="Move left">←</button><button data-key="ArrowDown" aria-label="Move down">↓</button><button data-key="ArrowRight" aria-label="Move right">→</button></div>
  <div id="overlay" class="overlay"></div>
  <script type="module" src="game.js?v=story2"></script>
</body>
</html>
