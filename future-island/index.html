<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eaf4ed">
  <meta name="description" content="和 Lucas 一起探索爸爸送给未来的长期投资礼物。一个关于定投、公司篮子和涨跌的亲子小游戏。">
