<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e8">
  <link rel="icon" href="art/pikachu.png">
  <link rel="stylesheet" href="duel.css?v=live-tempo-1">
  <title>宝可梦钢琴道馆 · Pokémon Piano League</title>
</head>
<body>
  <header class="topbar"><nav class="wrap topnav">
    <a href="../../index.html" class="home"><span class="ball" aria-hidden="true"></span><strong data-zh="Lucas 的游戏厅" data-en="Lucas’s arcade">Lucas 的游戏厅</strong></a>
    <span class="division" aria-hidden="true">/</span><span class="wordmark">PIANO LEAGUE</span>
    <div class="nav-actions"><button type="button" id="help" data-zh="玩法" data-en="How to play">玩法</button><button type="button" id="lang">English</button></div>
  </nav></header>
  <main class="wrap">
    <header class="mast"><div><h1 data-zh="宝可梦钢琴道馆" data-en="Pokémon Piano League">宝可梦钢琴道馆</h1>
      <p data-zh="挑一首曲子，用钢琴指挥搭档。弹到终曲，击败对手！" data-en="Pick a song and lead your partner at the piano. Play the finale to defeat your rival!">挑一首曲子，用钢琴指挥搭档。弹到终曲，击败对手！</p></div>
      <button type="button" class="case-button" id="openCase"><span class="badge-mark" aria-hidden="true">✦</span><span data-zh="我的徽章" data-en="My badges">我的徽章</span> <b id="caseCount"></b></button>
    </header>
    <div class="layout">
      <section class="console" aria-label="Battle">
        <div class="arena-top"><span id="zoneLabel"></span><span id="turnLabel"></span></div>
        <div class="arena">
          <canvas id="arenaCanvas" width="560" height="256" aria-label="Pokémon battle"></canvas>
          <div class="hud foe"><div><strong id="foeName"></strong><span class="role" data-zh="对手" data-en="Rival">对手</span></div><div class="hp-row"><b>HP</b><span class="hp-track"><i id="foeBar"></i></span><small id="foeHp"></small></div></div>
          <div class="hud ally"><div><strong id="allyName"></strong><span class="role" data-zh="搭档" data-en="Partner">搭档</span></div><div class="hp-row"><b>HP</b><span class="hp-track"><i id="allyBar"></i></span><small id="allyHp"></small></div></div>
          <div id="moveSplash" hidden></div>
        </div>
        <div class="battle-log"><span class="log-arrow" aria-hidden="true">▶</span><p id="log" role="status"></p><span id="combo"></span></div>
        <section id="songCard" class="song-card" aria-labelledby="songTitle">
          <div class="song-heading"><div class="song-identity"><h2 id="songTitle"></h2><p id="songCredit"></p></div>
            <div class="song-position"><strong id="scoreBar"></strong><span id="scoreSection"></span></div>
          </div>
          <div id="scoreProgress" class="score-progress" role="progressbar" aria-labelledby="songTitle"></div>
          <svg id="songStaff" class="song-staff" role="img" focusable="false"></svg>
          <div class="play-actions"><button class="primary" type="button" id="mic"><span class="mic-icon" aria-hidden="true">●</span> <span id="micLabel"></span></button>
            <button class="ghost" type="button" id="demo"></button><button class="secondary" type="button" id="screen"></button>
            <button class="ghost" type="button" id="skipUnheard" hidden data-zh="跳过漏听的音" data-en="Skip unheard note">跳过漏听的音</button>
          </div><p id="inputState" class="input-state"></p>
          <div class="tempo-panel" role="group" aria-labelledby="tempoLabel">
            <div class="tempo-setting">
              <label id="tempoLabel" for="tempo" data-zh="设定速度" data-en="Set tempo">设定速度</label>
              <span id="tempoReadout"></span>
            </div>
            <div class="tempo-adjust">
              <button type="button" id="tempoMinus"><span aria-hidden="true">−</span><span class="sr-only" data-zh="减慢 5 BPM" data-en="Slow down by 5 BPM">减慢 5 BPM</span></button>
              <input id="tempo" type="range" min="40" max="240" step="1" value="120" dir="ltr">
              <button type="button" id="tempoPlus"><span aria-hidden="true">+</span><span class="sr-only" data-zh="加快 5 BPM" data-en="Speed up by 5 BPM">加快 5 BPM</span></button>
            </div>
            <div class="tempo-follow">
              <label for="followTempo"><input id="followTempo" type="checkbox" checked><span data-zh="跟着我弹" data-en="Follow my playing">跟着我弹</span></label>
              <span id="followReadout"></span>
            </div>
          </div>
        </section>
        <section class="controller" aria-labelledby="controlTitle">
          <div class="controller-heading"><h2 id="controlTitle"></h2></div>
          <div id="lane" aria-label="节奏轨道"><div class="rail"></div><div id="laneTicks"></div><div class="hit-ring" aria-hidden="true"></div><div id="beats"></div></div>
          <div class="cue-row"><strong id="cue"></strong><span id="heard" aria-live="polite"></span></div>
          <div id="keyboard" aria-label="Piano keyboard"></div>
        </section>
      </section>
      <aside class="side">
        <details class="setup" id="setup" open><summary><span data-zh="训练家准备区" data-en="Trainer setup">训练家准备区</span><span aria-hidden="true">⌄</span></summary>
          <div class="setup-body"><h3 data-zh="选择搭档" data-en="Choose a partner">选择搭档</h3><div id="partners"></div>
            <div id="gyms">
              <h3 data-zh="第 50–60 页 · 本阶段曲目" data-en="Pages 50–60 · Current songs">第 50–60 页 · 本阶段曲目</h3>
              <div class="song-list" id="chapterSongs"></div>
              <details class="review-songs" id="midway"><summary><span data-zh="第 45–50 页 · 衔接曲目" data-en="Pages 45–50 · Practice songs">第 45–50 页 · 衔接曲目</span><span aria-hidden="true">⌄</span></summary>
                <div class="song-list" id="midwaySongs"></div>
              </details>
              <details class="review-songs" id="review"><summary><span data-zh="第 35–45 页 · 复习曲目" data-en="Pages 35–45 · Review songs">第 35–45 页 · 复习曲目</span><span aria-hidden="true">⌄</span></summary>
                <div class="song-list" id="reviewSongs"></div>
              </details>
            </div>
          </div></details>
        <div class="move-card"><div><h3 data-zh="搭档招式" data-en="Partner move">搭档招式</h3><b id="moveName"></b></div><p id="moveInfo"></p><div id="charge" aria-label="Power"></div></div>
        <a class="book-link" href="https://cloud.pianoadventures.com/products/piano-adventures-level-1-lesson-book-play-along-audio/" target="_blank" rel="noopener noreferrer" data-zh="听 FF1078 课本的官方配套音频 ↗" data-en="Listen to the FF1078 book recordings ↗">听 FF1078 课本的官方配套音频 ↗</a>
        <a class="book-link" href="../firefly/index.html" data-zh="回《萤火琴谷》练书上的技巧 ↗" data-en="Practise the book skills in Firefly Vale ↗">回《萤火琴谷》练书上的技巧 ↗</a>
      </aside>
    </div>
    <footer>Pokémon Piano League <span>·</span> <span data-zh="非官方同人游戏" data-en="Unofficial fan game">非官方同人游戏</span></footer>
  </main>
  <dialog id="sheet"><div class="sheet-head"><h2 id="sheetTitle"></h2><button id="dismiss" class="close" type="button" aria-label="Close">×</button></div><div id="sheetBody"></div><div id="sheetActions"></div></dialog>
  <script defer src="../firefly/audio.js?v=mic-recovery-1"></script><script defer src="../firefly/lessons.js"></script>
  <script defer src="arena.js?v=live-tempo-1"></script>
  <script defer src="songs.js?v=full-song-1"></script><script defer src="chapter-songs.js?v=ff1078-50"></script><script defer src="shepherd.js?v=ff1078-50"></script>
  <script defer src="midway-songs.js?v=ff1078-45"></script><script defer src="pony.js?v=ff1078-45"></script>
  <script defer src="score.js?v=live-tempo-1"></script><script defer src="battle.js?v=mic-recovery-1"></script>
</body>
</html>
